<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <label for=url>
        <input disabled id=url be-committed-to=change>
        <div>Hello</div>
        <button id=change onclick="passTest()">Click Here</button>
        <div id=target></div>
    </label>

    <script type=module>
        import '/emc.js';
    </script>
    <script>
        function passTest(){
            target.setAttribute('mark', 'good');
        }
        function runScript(){
            const keyEvent = new KeyboardEvent("keyup", { key: "Enter"});
            url.dispatchEvent(keyEvent)
        }
        setTimeout(() => {
            runScript();
        }, 500);
    </script>
        <be-hive>
        <script type=emc src="be-committed/emc.mjs"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</body>
</html>
